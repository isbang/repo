# Publishes the archives `repo upgrade` installs. Pushing a v* tag is the whole
# release process: the job cross-compiles every platform, writes checksums.txt
# and creates the GitHub release from them.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # `git describe` needs the history

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Build archives
        run: make dist VERSION=${{ github.ref_name }}

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/*.tar.gz dist/checksums.txt
          --title "${{ github.ref_name }}"
          --generate-notes
          --verify-tag
